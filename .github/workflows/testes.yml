name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Os testes cobrem dataset, métricas e regex: não precisam de torch nem de GPU.
      - run: pip install pytest
      - run: pytest -q tests
